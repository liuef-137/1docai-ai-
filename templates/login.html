<!DOCTYPE html>
<html lang="zh-CN" data-i18n-html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocAI - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='colors_and_type.css') }}">
    <style>
        :root {
            --color-primary: #1B365D; --color-primary-light: #2A4A7F; --color-primary-dark: #0F2440;
            --color-primary-tint-50: #E8EDF4; --color-accent: #2D9D78; --color-accent-light: #3DBF94;
            --color-accent-dark: #1F7D5C; --color-accent-tint-50: #E6F5F0;
            --color-bg: #FAFBFC; --color-bg-secondary: #F1F4F8; --color-surface: #FFFFFF;
            --color-border: #D8DDE6; --color-border-light: #E8ECF1;
            --color-text-primary: #1A2332; --color-text-secondary: #5A6677; --color-text-tertiary: #8892A0;
            --color-text-inverse: #FFFFFF; --state-success: #2D9D78; --state-error: #D45050;
            --font-display: 'DM Serif Display', Georgia, 'Noto Serif SC', serif;
            --font-body: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        * { box-sizing: border-box; }
        body { font-family: var(--font-body); background: var(--color-bg); color: var(--color-text-primary); margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid var(--color-border); border-top-color: var(--color-accent); border-radius: 50%; animation: spin 600ms linear infinite; }
        .toast-container { position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 12px 20px; border-radius: 8px; font-size: 14px; color: var(--color-text-inverse); background: var(--color-primary); box-shadow: 0 4px 16px rgba(0,0,0,0.15); transform: translateX(120%); opacity: 0; transition: transform 300ms ease, opacity 300ms ease; }
        .toast.show { transform: translateX(0); opacity: 1; }
        .toast.success { background: var(--state-success); }
        .toast.error { background: var(--state-error); }
    </style>
    <script>
    (function() {
        'use strict';
        var I18N_DATA = {{ i18n_data | safe }};
        window.I18N = {
            data: I18N_DATA,
            currentLang: 'zh',
            init: function() {
                var saved = localStorage.getItem('docai_lang');
                if (saved && I18N_DATA[saved]) { I18N.currentLang = saved; }
                I18N.applyAll();
            },
            t: function(key) {
                var lang = I18N.currentLang;
                if (I18N_DATA[lang] && I18N_DATA[lang][key]) return I18N_DATA[lang][key];
                if (I18N_DATA['zh'] && I18N_DATA['zh'][key]) return I18N_DATA['zh'][key];
                return key;
            },
            switchLang: function(lang) {
                if (!I18N_DATA[lang]) return;
                I18N.currentLang = lang;
                localStorage.setItem('docai_lang', lang);
                I18N.applyAll();
                document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            },
            applyAll: function() {
                var lang = I18N.currentLang;
                document.querySelectorAll('[data-i18n]').forEach(function(el) {
                    var key = el.getAttribute('data-i18n');
                    if (I18N_DATA[lang] && I18N_DATA[lang][key]) el.textContent = I18N_DATA[lang][key];
                });
                document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el) {
                    var key = el.getAttribute('data-i18n-placeholder');
                    if (I18N_DATA[lang] && I18N_DATA[lang][key]) el.setAttribute('placeholder', I18N_DATA[lang][key]);
                });
            }
        };
        document.addEventListener('DOMContentLoaded', function() { I18N.init(); });
    })();
    </script>
</head>
<body>
    <div class="toast-container" id="toast-container"></div>

    <div class="flex-1 flex items-center justify-center px-6 py-16">
        <div class="w-full max-w-md">
            <!-- Logo -->
            <div class="text-center mb-8">
                <a href="/" style="font-family: var(--font-display); font-size: 28px; color: var(--color-primary); text-decoration: none;">DocAI</a>
                <p class="mt-2 text-sm" style="color: var(--color-text-tertiary);" data-i18n="login.subtitle">智能合同分析平台</p>
            </div>

            <!-- Card -->
            <div class="rounded-2xl p-8" style="background: var(--color-surface); border: 1px solid var(--color-border-light); box-shadow: 0 2px 8px rgba(27,54,93,0.05);">
                <!-- Tabs -->
                <div class="flex border-b mb-6" style="border-color: var(--color-border-light);">
                    <button id="tab-login" class="flex-1 py-3 text-sm font-medium text-center border-b-2" style="border-color: var(--color-accent); color: var(--color-accent); background: none; border-top: none; border-left: none; border-right: none; cursor: pointer;" onclick="switchTab('login')" data-i18n="login.tab_login">登录</button>
                    <button id="tab-register" class="flex-1 py-3 text-sm font-medium text-center border-b-2" style="border-color: transparent; color: var(--color-text-tertiary); background: none; border-top: none; border-left: none; border-right: none; cursor: pointer;" onclick="switchTab('register')" data-i18n="login.tab_register">注册</button>
                </div>

                <!-- Login Form -->
                <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1.5" style="color: var(--color-text-secondary);" data-i18n="login.username">用户名</label>
                        <input type="text" name="username" required placeholder="输入用户名" data-i18n-placeholder="login.username_placeholder" class="w-full px-4 py-3 rounded-lg text-sm outline-none" style="background: var(--color-bg-secondary); color: var(--color-text-primary); border: 1px solid var(--color-border); transition: border-color 150ms;" onfocus="this.style.borderColor='var(--color-accent)'" onblur="this.style.borderColor='var(--color-border)'">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1.5" style="color: var(--color-text-secondary);" data-i18n="login.password">密码</label>
                        <input type="password" name="password" required placeholder="输入密码" data-i18n-placeholder="login.password_placeholder" class="w-full px-4 py-3 rounded-lg text-sm outline-none" style="background: var(--color-bg-secondary); color: var(--color-text-primary); border: 1px solid var(--color-border); transition: border-color 150ms;" onfocus="this.style.borderColor='var(--color-accent)'" onblur="this.style.borderColor='var(--color-border)'">
                    </div>
                    <div id="login-error" class="text-sm hidden" style="color: var(--state-error);"></div>
                    <button type="submit" id="login-btn" class="w-full py-3 rounded-lg text-sm font-semibold" style="background: var(--color-accent); color: var(--color-text-inverse); border: none; cursor: pointer;" data-i18n="login.btn_login">登录</button>
                </form>

                <!-- Register Form -->
                <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                    <div>
                        <label class="block text-sm font-medium mb-1.5" style="color: var(--color-text-secondary);" data-i18n="login.username">用户名</label>
                        <input type="text" name="username" required placeholder="2-80个字符" data-i18n-placeholder="login.username_hint" class="w-full px-4 py-3 rounded-lg text-sm outline-none" style="background: var(--color-bg-secondary); color: var(--color-text-primary); border: 1px solid var(--color-border); transition: border-color 150ms;" onfocus="this.style.borderColor='var(--color-accent)'" onblur="this.style.borderColor='var(--color-border)'">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1.5" style="color: var(--color-text-secondary);" data-i18n="login.email">邮箱</label>
                        <input type="email" name="email" required placeholder="your@email.com" data-i18n-placeholder="login.email_placeholder" class="w-full px-4 py-3 rounded-lg text-sm outline-none" style="background: var(--color-bg-secondary); color: var(--color-text-primary); border: 1px solid var(--color-border); transition: border-color 150ms;" onfocus="this.style.borderColor='var(--color-accent)'" onblur="this.style.borderColor='var(--color-border)'">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1.5" style="color: var(--color-text-secondary);" data-i18n="login.password">密码</label>
                        <input type="password" name="password" required placeholder="至少6个字符" data-i18n-placeholder="login.password_hint" class="w-full px-4 py-3 rounded-lg text-sm outline-none" style="background: var(--color-bg-secondary); color: var(--color-text-primary); border: 1px solid var(--color-border); transition: border-color 150ms;" onfocus="this.style.borderColor='var(--color-accent)'" onblur="this.style.borderColor='var(--color-border)'">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1.5" style="color: var(--color-text-secondary);" data-i18n="login.confirm_password">确认密码</label>
                        <input type="password" name="confirm_password" required placeholder="再次输入密码" data-i18n-placeholder="login.confirm_placeholder" class="w-full px-4 py-3 rounded-lg text-sm outline-none" style="background: var(--color-bg-secondary); color: var(--color-text-primary); border: 1px solid var(--color-border); transition: border-color 150ms;" onfocus="this.style.borderColor='var(--color-accent)'" onblur="this.style.borderColor='var(--color-border)'">
                    </div>
                    <div id="register-error" class="text-sm hidden" style="color: var(--state-error);"></div>
                    <button type="submit" id="register-btn" class="w-full py-3 rounded-lg text-sm font-semibold" style="background: var(--color-accent); color: var(--color-text-inverse); border: none; cursor: pointer;" data-i18n="login.btn_register">注册</button>
                </form>
            </div>

            <p class="text-center mt-6 text-sm" style="color: var(--color-text-tertiary);">
                <a href="/" style="color: var(--color-text-secondary); text-decoration: none;" data-i18n="login.back_home">返回首页</a>
            </p>
        </div>
    </div>

    <script>
        function showToast(msg, type) {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = 'toast ' + (type || '');
            t.textContent = msg;
            c.appendChild(t);
            requestAnimationFrame(() => t.classList.add('show'));
            setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
        }

        function switchTab(tab) {
            const lt = document.getElementById('tab-login');
            const rt = document.getElementById('tab-register');
            const lf = document.getElementById('form-login');
            const rf = document.getElementById('form-register');
            if (tab === 'login') {
                lt.style.borderColor = 'var(--color-accent)'; lt.style.color = 'var(--color-accent)';
                rt.style.borderColor = 'transparent'; rt.style.color = 'var(--color-text-tertiary)';
                lf.classList.remove('hidden'); rf.classList.add('hidden');
            } else {
                rt.style.borderColor = 'var(--color-accent)'; rt.style.color = 'var(--color-accent)';
                lt.style.borderColor = 'transparent'; lt.style.color = 'var(--color-text-tertiary)';
                rf.classList.remove('hidden'); lf.classList.add('hidden');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const form = e.target;
            const errEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');
            errEl.classList.add('hidden');
            btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
            try {
                const data = Object.fromEntries(new FormData(form));
                const resp = await fetch('/api/auth/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await resp.json();
                if (!resp.ok) { errEl.textContent = result.error || I18N.t('login.error_login_fail'); errEl.classList.remove('hidden'); return; }
                showToast(I18N.t('login.success_login'), 'success');
                localStorage.setItem('token', result.token);
                localStorage.setItem('user', JSON.stringify(result.user));
                const params = new URLSearchParams(window.location.search);
                const redirect = params.get('redirect') || '/analyze';
                setTimeout(() => { window.location.href = redirect; }, 500);
            } catch (err) { errEl.textContent = I18N.t('login.error_network'); errEl.classList.remove('hidden'); }
            finally { btn.disabled = false; btn.textContent = I18N.t('login.btn_login'); }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const form = e.target;
            const errEl = document.getElementById('register-error');
            const btn = document.getElementById('register-btn');
            const data = Object.fromEntries(new FormData(form));
            errEl.classList.add('hidden');
            if (data.password !== data.confirm_password) {
                errEl.textContent = I18N.t('login.error_password_mismatch'); errEl.classList.remove('hidden'); return;
            }
            delete data.confirm_password;
            btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
            try {
                const resp = await fetch('/api/auth/register', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await resp.json();
                if (!resp.ok) { errEl.textContent = result.error || I18N.t('login.error_register_fail'); errEl.classList.remove('hidden'); return; }
                showToast(I18N.t('login.success_register'), 'success');
                localStorage.setItem('token', result.token);
                localStorage.setItem('user', JSON.stringify(result.user));
                const params = new URLSearchParams(window.location.search);
                const redirect = params.get('redirect') || '/analyze';
                setTimeout(() => { window.location.href = redirect; }, 500);
            } catch (err) { errEl.textContent = I18N.t('login.error_network'); errEl.classList.remove('hidden'); }
            finally { btn.disabled = false; btn.textContent = I18N.t('login.btn_register'); }
        }

        // Auto-switch tab from URL param
        const params = new URLSearchParams(window.location.search);
        if (params.get('tab') === 'register') switchTab('register');
    </script>
</body>
</html>
