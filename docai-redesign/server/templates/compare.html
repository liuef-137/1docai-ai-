{% extends "base.html" %}
{% block title %}DocAI - 合同对比{% endblock %}

{% block content %}
<section class="py-8 lg:py-12" style="background: var(--color-bg);">
    <div class="mx-auto max-w-6xl px-6 lg:px-8">

        <div class="text-center mb-10">
            <h1 class="text-2xl md:text-3xl font-bold tracking-tight" style="font-family: var(--font-display); color: var(--color-primary); text-wrap: balance; word-break: keep-all;">合同对比分析</h1>
            <p class="mt-3 text-base" style="color: var(--color-text-secondary);">对比两份合同的差异，AI 智能解读变更的法律影响</p>
        </div>

        <!-- Two Textareas -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            <!-- Original -->
            <div>
                <label class="block text-sm font-medium mb-2" style="color: var(--color-text-secondary);">原始合同</label>
                <textarea id="original-text" rows="12" class="w-full resize-y rounded-lg px-4 py-3 text-sm outline-none" style="background: var(--color-surface); color: var(--color-text-primary); border: 1px solid var(--color-border); transition: border-color 150ms;" placeholder="粘贴原始合同文本..." onfocus="this.style.borderColor='var(--color-accent)'" onblur="this.style.borderColor='var(--color-border)'"></textarea>
            </div>
            <!-- Modified -->
            <div>
                <label class="block text-sm font-medium mb-2" style="color: var(--color-text-secondary);">修改后合同</label>
                <textarea id="modified-text" rows="12" class="w-full resize-y rounded-lg px-4 py-3 text-sm outline-none" style="background: var(--color-surface); color: var(--color-text-primary); border: 1px solid var(--color-border); transition: border-color 150ms;" placeholder="粘贴修改后的合同文本..." onfocus="this.style.borderColor='var(--color-accent)'" onblur="this.style.borderColor='var(--color-border)'"></textarea>
            </div>
        </div>

        <!-- Compare Button -->
        <div class="text-center mb-12">
            <button id="btn-compare" onclick="handleCompare()" class="inline-flex items-center justify-center px-8 py-3 rounded-lg text-base font-semibold" style="background: var(--color-accent); color: var(--color-text-inverse); border: none; cursor: pointer; transition: background 150ms;" onmouseenter="if(!this.disabled)this.style.background='var(--color-accent-light)'" onmouseleave="if(!this.disabled)this.style.background='var(--color-accent)'">
                <i data-lucide="git-compare" class="w-5 h-5 mr-2"></i>开始对比
            </button>
        </div>

        <!-- Loading -->
        <div id="compare-loading" class="hidden flex items-center justify-center py-16 gap-3">
            <span class="spinner" style="width: 24px; height: 24px; border-width: 3px;"></span>
            <span class="text-sm" style="color: var(--color-text-secondary);">AI 正在分析差异...</span>
        </div>

        <!-- Results -->
        <div id="compare-results" class="hidden">

            <!-- Summary Stats Bar -->
            <div id="compare-stats" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8"></div>

            <!-- Side-by-side comparison -->
            <div id="compare-changes" class="space-y-4 mb-8"></div>

            <!-- AI Interpretation -->
            <div id="compare-interpretation" class="border rounded-xl p-6 sm:p-8" style="border-color: var(--color-border-light); box-shadow: var(--shadow-sm);">
                <div class="flex items-center gap-2 mb-4">
                    <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: var(--color-accent-tint-50);">
                        <i data-lucide="brain" class="w-4 h-4" style="color: var(--color-accent);"></i>
                    </div>
                    <h2 class="text-lg font-semibold" style="color: var(--color-text-primary);">AI 整体评估</h2>
                </div>
                <p id="interpretation-text" class="text-sm leading-relaxed" style="color: var(--color-text-secondary);"></p>
            </div>

        </div>
    </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
(function() {
    window.handleCompare = function() {
        requireAuth(async () => {
            const original = document.getElementById('original-text').value.trim();
            const modified = document.getElementById('modified-text').value.trim();
            if (!original || !modified) { showToast('请输入两份合同文本', 'warning'); return; }

            const btn = document.getElementById('btn-compare');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> 分析中...';
            document.getElementById('compare-loading').classList.remove('hidden');
            document.getElementById('compare-results').classList.add('hidden');

            try {
                const resp = await apiFetch('/api/compare', {
                    method: 'POST',
                    body: JSON.stringify({ original_text: original, modified_text: modified })
                });
                const data = await resp.json();
                if (!resp.ok) { showToast(data.error || '对比失败', 'error'); return; }

                renderCompareResults(data.compare);
            } catch (err) {
                showToast('网络错误，请重试', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i data-lucide="git-compare" class="w-5 h-5 mr-2"></i>开始对比';
                document.getElementById('compare-loading').classList.add('hidden');
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        });
    };

    function renderCompareResults(compare) {
        const result = compare.diff_result ? JSON.parse(compare.diff_result) : null;
        const changes = result ? result.changes : [];

        document.getElementById('compare-results').classList.remove('hidden');

        // Stats
        const added = changes.filter(c => c.type === 'added').length;
        const modified = changes.filter(c => c.type === 'modified').length;
        const deleted = changes.filter(c => c.type === 'deleted').length;
        const highRisk = changes.filter(c => c.risk_level === 'high').length;

        const statsHtml =
            '<div class="rounded-xl p-5 text-center" style="background: var(--color-surface); border: 1px solid var(--color-border-light); box-shadow: var(--shadow-sm);">' +
            '<div class="text-2xl font-bold" style="color: var(--color-accent); font-family: var(--font-display);">' + changes.length + '</div>' +
            '<div class="mt-1 text-xs" style="color: var(--color-text-tertiary);">总变更数</div></div>' +
            '<div class="rounded-xl p-5 text-center" style="background: var(--color-surface); border: 1px solid var(--color-border-light); box-shadow: var(--shadow-sm);">' +
            '<div class="text-2xl font-bold" style="color: var(--state-info); font-family: var(--font-display);">+' + added + '</div>' +
            '<div class="mt-1 text-xs" style="color: var(--color-text-tertiary);">新增条款</div></div>' +
            '<div class="rounded-xl p-5 text-center" style="background: var(--color-surface); border: 1px solid var(--color-border-light); box-shadow: var(--shadow-sm);">' +
            '<div class="text-2xl font-bold" style="color: var(--state-warning); font-family: var(--font-display);">' + modified + '</div>' +
            '<div class="mt-1 text-xs" style="color: var(--color-text-tertiary);">修改条款</div></div>' +
            '<div class="rounded-xl p-5 text-center" style="background: var(--color-surface); border: 1px solid var(--color-border-light); box-shadow: var(--shadow-sm);">' +
            '<div class="text-2xl font-bold" style="color: var(--risk-high); font-family: var(--font-display);">' + highRisk + '</div>' +
            '<div class="mt-1 text-xs" style="color: var(--color-text-tertiary);">高风险变更</div></div>';
        document.getElementById('compare-stats').innerHTML = statsHtml;

        // Changes list
        const container = document.getElementById('compare-changes');
        container.innerHTML = '';
        if (changes.length === 0) {
            container.innerHTML = '<div class="text-center py-8"><p class="text-sm" style="color: var(--color-text-secondary);">未检测到显著差异</p></div>';
        } else {
            changes.forEach((ch, i) => {
                const typeLabels = { added: '新增', modified: '修改', deleted: '删除' };
                const typeColors = { added: 'var(--state-info)', modified: 'var(--state-warning)', deleted: 'var(--risk-high)' };
                const riskColors = { high: 'var(--risk-high)', medium: 'var(--risk-medium)', low: 'var(--risk-low)', none: 'var(--color-text-tertiary)' };
                const riskLabels = { high: '高风险', medium: '中风险', low: '低风险', none: '无' };
                const tc = typeColors[ch.type] || 'var(--color-text-tertiary)';
                const rc = riskColors[ch.risk_level] || 'var(--color-text-tertiary)';

                let card = '<div class="border rounded-xl overflow-hidden" style="border-color: var(--color-border-light); box-shadow: var(--shadow-sm);">' +
                    '<div class="flex items-center justify-between px-5 py-3" style="background: var(--color-bg-secondary);">' +
                    '<div class="flex items-center gap-2"><span class="text-xs font-semibold px-2 py-0.5 rounded" style="color: ' + tc + '; background: ' + tc + '14;">' + (typeLabels[ch.type] || ch.type) + '</span>' +
                    '<span class="text-sm font-medium" style="color: var(--color-text-primary);">' + escapeHtml(ch.location || '位置未标注') + '</span></div>' +
                    '<span class="text-xs font-medium px-2 py-1 rounded-md" style="color: ' + rc + '; background: ' + rc + '14;">' + (riskLabels[ch.risk_level] || ch.risk_level) + '</span></div>';

                if (ch.type === 'modified') {
                    card += '<div class="grid grid-cols-1 md:grid-cols-2 divide-x" style="border-color: var(--color-border-light);">' +
                        '<div class="p-4"><div class="text-xs font-semibold mb-2" style="color: var(--risk-high);">原文</div><p class="text-sm leading-relaxed" style="color: var(--color-text-secondary);">' + escapeHtml(ch.original) + '</p></div>' +
                        '<div class="p-4"><div class="text-xs font-semibold mb-2" style="color: var(--state-info);">修改后</div><p class="text-sm leading-relaxed" style="color: var(--color-text-secondary);">' + escapeHtml(ch.modified) + '</p></div></div>';
                } else if (ch.type === 'deleted') {
                    card += '<div class="p-4"><div class="text-xs font-semibold mb-2" style="color: var(--risk-high);">删除内容</div><p class="text-sm leading-relaxed" style="color: var(--color-text-secondary); text-decoration: line-through; opacity: 0.7;">' + escapeHtml(ch.original) + '</p></div>';
                } else {
                    card += '<div class="p-4"><div class="text-xs font-semibold mb-2" style="color: var(--state-info);">新增内容</div><p class="text-sm leading-relaxed" style="color: var(--color-text-secondary);">' + escapeHtml(ch.modified) + '</p></div>';
                }

                if (ch.impact) {
                    card += '<div class="px-5 py-3" style="border-top: 1px solid var(--color-border-light);"><p class="text-sm" style="color: var(--color-text-secondary);"><strong style="color: var(--color-text-primary);">影响分析：</strong>' + escapeHtml(ch.impact) + '</p></div>';
                }
                if (ch.suggestion) {
                    card += '<div class="px-5 py-3" style="border-top: 1px solid var(--color-border-light);"><p class="text-sm" style="color: var(--color-accent);"><strong>建议：</strong>' + escapeHtml(ch.suggestion) + '</p></div>';
                }
                card += '</div>';
                container.innerHTML += card;
            });
        }

        // Interpretation
        document.getElementById('interpretation-text').textContent = compare.ai_interpretation || result.risk_summary || result.overall_assessment || '暂无评估';

        document.getElementById('compare-results').scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
})();
</script>
{% endblock %}
