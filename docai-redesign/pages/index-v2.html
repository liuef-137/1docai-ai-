<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocAI - 智能合同分析</title>
    <style id="theme-vars">
/* DocAI Brand Design System - Professional Trust Style */
/* Primary: Deep Navy + Emerald Accent */

:root {
  /* === Brand Colors === */
  --color-primary: #1B365D;
  --color-primary-light: #2A4A7F;
  --color-primary-dark: #0F2440;
  --color-primary-tint-50: #E8EDF4;
  --color-primary-tint-100: #D1DBED;
  --color-primary-tint-200: #B3C7E0;
  --color-primary-tint-300: #8AAED3;
  --color-primary-tint-400: #618DC6;

  /* Accent: Emerald */
  --color-accent: #2D9D78;
  --color-accent-light: #3DBF94;
  --color-accent-dark: #1F7D5C;
  --color-accent-tint-50: #E6F5F0;
  --color-accent-tint-100: #CCF0E0;
  --color-accent-tint-200: #99E0C1;
  --color-accent-tint-300: #66D1A2;

  /* Neutrals */
  --color-bg: #FAFBFC;
  --color-bg-secondary: #F1F4F8;
  --color-bg-tertiary: #E8ECF1;
  --color-surface: #FFFFFF;
  --color-surface-hover: #F8F9FB;
  --color-border: #D8DDE6;
  --color-border-light: #E8ECF1;
  --color-text-primary: #1A2332;
  --color-text-secondary: #5A6677;
  --color-text-tertiary: #8892A0;
  --color-text-inverse: #FFFFFF;

  /* State Colors */
  --state-success: #2D9D78;
  --state-warning: #E8A33D;
  --state-error: #D45050;
  --state-info: #3A7BD5;

  /* Risk Level Colors (DocAI specific) */
  --risk-high: #D45050;
  --risk-medium: #E8A33D;
  --risk-low: #2D9D78;

  /* === Typography === */
  --font-display: 'DM Serif Display', Georgia, 'Noto Serif SC', serif;
  --font-body: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;
  --text-4xl: 2.25rem;
  --text-5xl: 3rem;
  --text-6xl: 3.75rem;

  --leading-tight: 1.25;
  --leading-snug: 1.35;
  --leading-normal: 1.5;
  --leading-relaxed: 1.65;

  --tracking-tight: -0.025em;
  --tracking-normal: 0;
  --tracking-wide: 0.025em;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* === Spacing === */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --space-16: 4rem;
  --space-20: 5rem;
  --space-24: 6rem;

  /* === Border Radius === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Shadows === */
  --shadow-sm: 0 1px 2px rgba(27, 54, 93, 0.04);
  --shadow-md: 0 2px 8px rgba(27, 54, 93, 0.05);
  --shadow-lg: 0 4px 16px rgba(27, 54, 93, 0.05);
  --shadow-float: 0 8px 32px rgba(27, 54, 93, 0.08);
}

/* Dark Mode Variables */
.dark {
  --color-bg: #0F1520;
  --color-bg-secondary: #151C2A;
  --color-bg-tertiary: #1E2738;
  --color-surface: #1A2332;
  --color-surface-hover: #212D3E;
  --color-border: #2A3546;
  --color-border-light: #232E3F;
  --color-text-primary: #E8ECF1;
  --color-text-secondary: #A0AAB8;
  --color-text-tertiary: #6B7585;
  --color-text-inverse: #1A2332;

  --color-primary-tint-50: #1A2332;
  --color-primary-tint-100: #1E2738;
  --color-primary-tint-200: #253248;
  --color-primary-tint-300: #3A4F70;
  --color-primary-tint-400: #4A6590;

  --color-accent-tint-50: #132A22;
  --color-accent-tint-100: #1A3529;
  --color-accent-tint-200: #264D3E;
  --color-accent-tint-300: #326653;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.25);
  --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.3);
  --shadow-float: 0 8px 32px rgba(0, 0, 0, 0.4);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--color-primary);
    --color-accent: var(--color-accent);
    --color-border: var(--color-border);
  }
  @layer base {
    body { background: var(--color-surface); color: var(--color-text-primary); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
